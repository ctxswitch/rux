services:
  scylla:
    image: scylladb/scylla:6.2
    container_name: rux-scylla
    command:
      - --smp
      - "1"
      - --memory
      - 1G
      - --overprovisioned
      - "1"
      - --developer-mode
      - "1"
      - --listen-address
      - 0.0.0.0
      - --rpc-address
      - 0.0.0.0
      - --api-address
      - 0.0.0.0
    ports:
      - "9042:9042"
      - "9160:9160"
      - "10000:10000"
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' 127.0.0.1 9042 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
